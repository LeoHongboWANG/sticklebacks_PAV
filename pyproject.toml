[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcf-polar"
version = "2.0.0"
description = "Reference-preserving ancestral-allele annotation and derived dosage for VCF/BCF"
readme = "02.deleterious_mutation/README.md"
requires-python = ">=3.10"
dependencies = ["pysam>=0.22,<0.24"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
vcf-polar = "vcf_polar:main"

[project.urls]
Repository = "https://github.com/LeoHongboWANG/sticklebacks_PAV"
Issues = "https://github.com/LeoHongboWANG/sticklebacks_PAV/issues"

[tool.setuptools]
py-modules = ["vcf_polar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
